# fly.toml
app = 'claudia-and-julio-weddinginvite'
#primary_region = 'gdl'     # Guadalajara region ✏️ deprecated
primary_region = 'dfw'      # dallas forth worth?

[build] # ← this alone is enough to use your Dockerfile

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1